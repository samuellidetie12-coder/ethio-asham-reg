<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Asham MaaS - Tractor Registration</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; font-size: 18px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #27ae60; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #219653; }
    </style>
</head>
<body>

<div class="container">
    <h2>የአግሮ-ሜካናይዜሽን ምዝገባ<br>Tractor Registration<br>Galmee Maashinii Qonnaა</h2>
    
    <label>1. የባለቤቱ ስም / Owner Name / Maqaa Abbaa Qabeenyaა</label>
    <input type="text" id="owner_name" placeholder="ሙሉ ስም ያስገቡ">

    <label>2. የኦፕሬተር ስም / Operator Name / Maqaa Hojjetaა</label>
    <input type="text" id="operator_name" placeholder="የኦፕሬተር ስም (ካለ)">

    <label>3. ስልክ ቁጥር / Phone Number / Lakkoofsa Bilbilaა</label>
    <input type="tel" id="phone" placeholder="09xxxxxxxx">

    <label>4. የማሽን ዓይነት / Machine Type / Gosa Maashinii</label>
    <select id="machine_type">
        <option value="Tractor">ትራክተር / Tractor</option>
        <option value="Combine Harvester">ኮምባይን ሃርቨስተር / Combine Harvester</option>
    </select>

    <label>5. የብራንድ እና ሞዴል / Brand & Model / Brandii fi Modelii</label>
    <input type="text" id="brand_model" placeholder="ለምሳሌ፦ John Deere, Sonalika">

    <label>6. የፈረስ ጉልበት / Horsepower / Humna Faaruu (HP)</label>
    <input type="text" id="horsepower" placeholder="ለምሳሌ፦ 75 HP">

    <label>7. የሰሌዳ ቁጥር / Plate Number / Lakkoofsa Gabatee</label>
    <input type="text" id="plate_no" placeholder="የሰሌዳ ቁጥር">

    <label>8. የሚገኝበት ቦታ / Location / Bakka Argamuu</label>
    <input type="text" id="location" placeholder="ክልል/ዞን/ወረዳ">

    <label>9. የማግኘት ሁኔታ / Availability / Haala Argamummaa</label>
    <select id="availability">
        <option value="Available">ይገኛል / Available</option>
        <option value="Busy">በሥራ ላይ ነው / Busy</option>
    </select>

    <label>10. የዋጋ መለኪያ / Pricing Unit / Safartuu Gatii</label>
    <select id="pricing_unit">
        <option value="Hectare">በሄክታር / Per Hectare</option>
        <option value="Hour">በሰዓት / Per Hour</option>
        <option value="Day">በቀን / Per Day</option>
    </select>

    <label>11. የዋጋ መጠን / Price Amount / Gatii</label>
    <input type="number" id="pricing" placeholder="በብር መጠን">

    <button type="button" onclick="submitData()">ምዝገባውን ላክ / Submit / Ergi</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    try {
        tg.expand();
    } catch (e) {
        console.log("Not Telegram environment");
    }

    function submitData() {
        const formData = {
            owner_name: document.getElementById('owner_name').value.trim(),
            operator_name: document.getElementById('operator_name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            machine_type: document.getElementById('machine_type').value,
            brand_model: document.getElementById('brand_model').value.trim(),
            horsepower: document.getElementById('horsepower').value.trim(),
            plate_no: document.getElementById('plate_no').value.trim(),
            location: document.getElementById('location').value.trim(),
            availability: document.getElementById('availability').value,
            pricing_unit: document.getElementById('pricing_unit').value,
            pricing: document.getElementById('pricing').value.trim()
        };

        if (!formData.owner_name || !formData.phone || !formData.location) {
            alert("እባክዎ ባለቤት፣ ስልክ እና የሚገኝበትን ቦታ ይሙሉ! / Please fill required fields!");
            return;
        }

        const btn = document.querySelector('button');
        btn.disabled = true;
        btn.innerText = "በመላክ ላይ... / Sending... / Ergaa jira...";

        // የ Google Apps Script ዌብ አፕ ሊንክዎን ከታች ይለጥፉ
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzxPDBsFt2yKNK1hcenM3WTQ7ZHWTPK6cUqVqY-PSV8sXRg4tMrLvyFqVrwsrfD5MnOcQ/exec';

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(result => {
            alert("ምዝገባዎ በተሳካ ሁኔታ ተጠናቋል! እናመሰግናለን።");
            try {
                tg.close();
            } catch (e) {
                location.reload();
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("በምዝገባ ወቅት ችግር ተፈጥሯል. እባክዎ እንደገና ይሞክሩ።");
            btn.disabled = false;
            btn.innerText = "ምዝገባውን ላክ / Submit / Ergi";
        });
    }
</script>

</body>
</html>
